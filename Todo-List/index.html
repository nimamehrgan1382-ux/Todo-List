```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List | Nima</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="container">


        <h1>
            لیست کارهای من
        </h1>


        <!-- Todo Input -->

        <div class="todo-input">


            <input
                type="text"
                id="todoInput"
                placeholder="کار جدید را وارد کنید"
            >


            <button id="addTodo">
                افزودن
            </button>


        </div>


        <!-- Todo List -->

        <ul id="todoList">

        </ul>


        <!-- Todo Count -->

        <p id="todoCount">
            تعداد کارها: 0
        </p>


        <!-- Todo Message -->

        <p id="todoMessage"></p>


        <!-- Todo Filters -->

        <div class="todo-filters">


            <button id="showAll">
                همه
            </button>


            <button id="showCompleted">
                انجام‌شده
            </button>


            <button id="showPending">
                انجام‌نشده
            </button>


        </div>


        <!-- Clear All -->

        <button id="clearAll">
            حذف همه کارها
        </button>


        <!-- Storage Message -->

        <p id="storageMessage">
            اطلاعات شما در مرورگر ذخیره می‌شود.
        </p>


    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>


</body>

</html>
```
